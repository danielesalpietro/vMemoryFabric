name: Publish Docker image to GHCR

# Manual only, deliberately — same reasoning as full-gpu-tests in ci.yml:
# this builds and pushes a public artifact, not something that should
# happen as a side effect of every push. Build runs on a GitHub-hosted
# runner, not the self-hosted GPU box: producing the CUDA devel image
# doesn't execute any GPU code, only installs packages, so there's no
# reason to tie up Z8-G4-RTX3090 for this.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "Sprint-3-Oskarshamn"

env:
  # Hardcoded lowercase, not derived from github.repository — GHCR (like
  # all OCI registries) requires the image path to be all-lowercase, but
  # the GitHub repo itself is "vMemoryFabric" (mixed case).
  IMAGE_NAME: ghcr.io/danielesalpietro/vmemoryfabric

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image tags
        id: tags
        run: |
          # Docker repo *paths* must be lowercase; tags may not, but we
          # lowercase them too for consistency and to sidestep any
          # registry-specific case-sensitivity surprises.
          ref_slug=$(echo "${{ inputs.ref }}" | tr '[:upper:]/' '[:lower:]-')
          short_sha=$(git rev-parse --short HEAD)
          echo "ref_slug=${ref_slug}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_slug }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_slug }}-${{ steps.tags.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_slug }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_slug }}-${{ steps.tags.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "First publish only: the package is created **private** by" >> "$GITHUB_STEP_SUMMARY"
          echo "default — flip it to Public under the package's own Settings" >> "$GITHUB_STEP_SUMMARY"
          echo "page (Package settings → Change visibility). GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          echo "cannot do this from the workflow; it needs a manual, one-time" >> "$GITHUB_STEP_SUMMARY"
          echo "click from an account with admin rights on the package." >> "$GITHUB_STEP_SUMMARY"
