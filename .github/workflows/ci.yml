name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-tests:
    name: CPU Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lightweight, CPU-only subset of osx-poc/requirements.txt.
      # vLLM/CUDA deps are intentionally NOT installed here (needed only by
      # the GPU-marked tests, which this job excludes). torch IS installed,
      # but as the small CPU-only wheel (~190 MB, no bundled CUDA libs):
      # TierManager.__init__ always constructs a GPUTransfer, which needs
      # `torch` to be importable even for tests that never touch real CUDA.
      # scikit-learn: PT-PEP's TF-IDF classifier is CPU-only by design, no
      # reason to gate it behind the GPU job. nvidia-ml-py: `import scheduler`
      # pulls in GCSGGuard, which imports pynvml (nvidia-ml-py's module name)
      # at module load time even though its NVML calls no-op gracefully here
      # with no GPU/driver present.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install \
            pytest==8.2.1 \
            pytest-asyncio==0.23.7 \
            pytest-cov==5.0.0 \
            numpy==1.26.4 \
            aiofiles==23.2.1 \
            pybloom-live==4.0.0 \
            scikit-learn==1.5.0 \
            nvidia-ml-py==13.610.43

      - name: Run CPU tests
        working-directory: osx-poc
        env:
          PYTHONPATH: src
        run: pytest tests/ -m "not gpu" -v

  full-gpu-tests:
    name: Full GPU Tests
    runs-on: [self-hosted, gpu]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker compose build

      - name: Run full test suite (incl. GPU-marked tests)
        run: docker compose run --rm osx-dev bash -c "cd osx-poc && PYTHONPATH=src pytest tests/ -v"

      - name: Run M1 (EAT) benchmark on target hardware
        run: docker compose run --rm osx-dev bash -c "cd osx-poc && PYTHONPATH=src python benchmarks/bench_eat.py > bench_eat_result.json"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: bench-eat-result
          path: osx-poc/bench_eat_result.json

      - name: Run M2 (Tier Manager) benchmark on target hardware
        run: docker compose run --rm osx-dev bash -c "cd osx-poc && PYTHONPATH=src python benchmarks/bench_tier.py > bench_tier_result.json"

      - name: Upload tier benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: bench-tier-result
          path: osx-poc/bench_tier_result.json
