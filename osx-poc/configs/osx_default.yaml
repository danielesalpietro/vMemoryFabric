# OSX-PoC — Configurazione default
# Setup dev: Docker su Windows, RTX 3090 (single GPU), no PMEM, no io_uring

# ── Hardware ────────────────────────────────────────────────────────────────────
hardware:
  gpu:
    device_id: 0
    name: "RTX 3090"
    vram_gb: 24
    pinned_memory: false          # non disponibile Docker/Windows
  pmem:
    enabled: false                # deferred — non disponibile in dev
    path: null
  nvme:
    path: "/data/nvme"            # volume Docker montato
    use_io_uring: false           # non disponibile su WSL2/Windows Docker

# ── EMH tiers attivi (dev) ────────────────────────────────────────────────────
# Tier attivi: VRAM (0) → DDR4 (1) → NVMe (2)
# PMEM (tra DDR4 e NVMe) deferred.
emh:
  tiers_active: [0, 1, 2]   # VRAM, DDR4, NVME
  shard_size_mb: 256

# ── M1: Expert Access Table ────────────────────────────────────────────────────
eat:
  capacity: 16384             # 256 expert × 64 shard
  bloom_error_rate: 0.01      # 1% false positive
  slab_n_slots: 4             # slots DDR4 pre-allocati (dev: piccolo)

# ── M2: Tier Manager ──────────────────────────────────────────────────────────
tier_manager:
  use_see_policy: true
  see:
    alpha: 0.3                # peso frequenza
    beta:  0.3                # peso recency
    gamma: 0.4                # peso similarità semantica (stub Sprint 2, attivo Sprint 3)
  session_vram_quota_gb: 20   # quota VRAM per sessione (headroom per shadow pool)

# ── M3: Expert Scheduler ──────────────────────────────────────────────────────
scheduler:
  ptpep:
    # TF-IDF+centroidi (Sprint 3 baseline, non ONNX/BERT-small — vedi
    # scripts/build_ptpep_classifier.py e src/scheduler/ptpep.py). Path
    # relativo alla working directory di osx-poc; null = stub mode.
    model_path: models/ptpep_tfidf_v1.joblib
    confidence_threshold: 0.6
    domains: [coding, math, language, science, medical, legal, creative, general]
    expert_map:  # empirical routing statistics, not ground truth — Mixtral MoE
                 # gating is input-dependent, not a fixed domain->expert identity.
                 # Placeholder until derived from real routing stats on a sample set.
      coding:   [0, 3]
      math:     [1, 4]
      language: [2, 5]
      science:  [1, 3]
      medical:  [6, 7]
      legal:    [6, 7]
      creative: [2, 5]
      general:  [0, 1, 2, 3, 4, 5, 6, 7]
  gcsg:
    theta_gate:          0.85
    theta_entropy:       0.70
    theta_contamination: 0.05
    # top-2 expert INT4, non top-4: a ~3 GB/expert (vedi memory math in
    # src/scheduler/gcsg.py), 4 experti + modello attivo (~14-16 GB) supera i
    # 24 GB della 3090 in ogni scenario realistico. Il preflight VRAM in
    # GCSGGuard.__init__ abbassa comunque a runtime a 1 se il modello ha
    # consumato più di ~18 GB all'avvio, o fallisce fast se non basta neanche 1.
    shadow_pool_size:    2
  aer:
    enabled: false            # deferred — dual-GPU

# ── Observability ─────────────────────────────────────────────────────────────
metrics:
  prometheus_port: 9090
  scrape_interval_s: 5

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO
  format: json
